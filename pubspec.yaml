name: transit_go
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.10.0
  firebase_crashlytics: ^4.3.0
  firebase_remote_config: ^5.3.0
